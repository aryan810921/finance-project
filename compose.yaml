services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL:  " "
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - finance-network

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - finance-network

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - finance-mongo-data:/data/db
    networks:
      - finance-network

  nginx:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - finance-network
networks:
  finance-network:
    external: true

volumes:
  finance-mongo-data:
    external: true
